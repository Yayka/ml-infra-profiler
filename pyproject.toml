[tool.ruff]
line-length = 88
target-version = "py310"
src = ["scripts"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes (unused imports, undefined names)
    "I",  # isort (import ordering)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
